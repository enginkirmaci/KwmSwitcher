<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="KwmSwitcher logo">
  <title>KwmSwitcher</title>
  <desc>A monitor whose screen is split between Local (green) and Remote (purple), with a bright swap arrow.</desc>

  <!-- Monitor frame (light, no badge background) -->
  <rect x="16" y="20" width="224" height="170" rx="22" fill="#E5E7EB" />

  <!-- Split screen: Local (green) left, Remote (purple) right -->
  <path d="M38 42 H128 V168 H38 a22 22 0 0 1 -22 -22 V64 a22 22 0 0 1 22 -22 Z" fill="#22C55E" />
  <path d="M218 42 H128 V168 H218 a22 22 0 0 1 22 -22 V64 a22 22 0 0 1 -22 -22 Z" fill="#8B5CF6" />

  <!-- Center seam -->
  <rect x="124" y="42" width="8" height="126" fill="#0F0F0F" />

  <!-- Bright swap arrow pointing right (Local -> Remote) -->
  <path d="M58 97 H162 V83 L198 113 L162 143 V129 H58 Z" fill="#FFFFFF" />

  <!-- Monitor stand (shorter neck, lower base) -->
  <rect x="116" y="190" width="24" height="14" fill="#E5E7EB" />
  <rect x="80" y="204" width="96" height="18" rx="9" fill="#E5E7EB" />
</svg>
